name: Proofline
on:
  pull_request:
jobs:
  proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: zysen1/Proofline@main
        with:
          base: ${{ github.base_ref }}
          head: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
